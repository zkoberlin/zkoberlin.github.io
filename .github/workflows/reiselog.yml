name: Reiselogger Sync

on:
  schedule:
    - cron: '0 4 * * *'   # täglich 04:00 UTC (06:00 Berlin Sommerzeit / 05:00 Winterzeit)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reisedaten abrufen & aggregieren
        env:
          REISELOG_WORKER_URL: ${{ secrets.REISELOG_WORKER_URL }}
          REISELOG_TOKEN: ${{ secrets.REISELOG_TOKEN }}
        run: python scripts/fetch_reiselog.py

      - name: Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/reiselog.json
          git diff --staged --quiet || git commit -m "chore: reiselog.json aktualisiert"
          git push
