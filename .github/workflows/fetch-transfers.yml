name: Fetch Union Berlin Transfers

on:
  # schedule:
  #   # Täglich um 08:00 UTC (10:00 Berliner Sommerzeit)
  #   - cron: '0 8 * * *'
  workflow_dispatch:  # Manuell auslösbar — reaktivieren wenn Saison 26/27 startet

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Repo-Setting: Read and write permissions muss aktiviert sein

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run fetch_transfers.py
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: python scripts/fetch_transfers.py

      - name: Commit and push transfers.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/transfers.json
          git diff --cached --quiet || git commit -m "chore: update transfers.json [$(date -u +%Y-%m-%dT%H:%M)]"
          git push
