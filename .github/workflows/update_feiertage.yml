name: Update Feiertage Berlin

on:
  schedule:
    - cron: "15 3 1 * *"
  workflow_dispatch:

concurrency:
  group: feiertage-berlin-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Berliner Feiertage aktualisieren
        run: python scripts/fetch_feiertage_berlin.py

      - name: Vollständige Datei committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/feiertage_berlin.json
          git diff --cached --quiet && echo "Keine Änderungen" && exit 0
          git commit -m "chore: Berliner Feiertage aktualisiert [skip ci]"
          git pull --rebase origin main
          git push origin main
