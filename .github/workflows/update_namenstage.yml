name: Update Namenstage

on:
  schedule:
    # Monatlich am 1. um 03:30 UTC; Namenstage ändern sich nicht täglich.
    - cron: '30 3 1 * *'
  workflow_dispatch:  # Manuell auslösbar

concurrency:
  group: namenstage-update
  cancel-in-progress: false

jobs:
  update-namenstage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # Nötig für git commit

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run fetch script
        run: python scripts/fetch_namenstage.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/namenstage.json
          git diff --cached --quiet || git commit -m "chore: Namenstage aktualisiert [skip ci]"
          git pull --rebase origin main
          git push origin main
