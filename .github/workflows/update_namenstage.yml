name: Update Namenstage

on:
  schedule:
    # Täglich 04:00 UTC (= 06:00 CEST / 05:00 CET)
    - cron: '0 4 * * *'
  workflow_dispatch:  # Manuell auslösbar

jobs:
  update-namenstage:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Nötig für git commit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run fetch script
        run: python scripts/fetch_namenstage.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/namenstage.json
          git diff --cached --quiet || git commit -m "chore: Namenstage aktualisiert [skip ci]"
          git push
