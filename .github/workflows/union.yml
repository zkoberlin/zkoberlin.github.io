name: Union Berlin Daten aktualisieren
 
on:
  schedule:
    - cron: '0 7 * * *'   # täglich 07:00 UTC
  workflow_dispatch:        # manueller Trigger
 
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
 
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # vollständige History für rebase
 
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
 
      - name: Union-Daten fetchen
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          FOOTBALLDATA_KEY: ${{ secrets.FOOTBALLDATA_KEY }}
        run: python scripts/fetch_union.py
 
      - name: JSON committen und pushen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/union.json
          git diff --cached --quiet && echo "Keine Änderungen" && exit 0
          git commit -m "chore: union daten aktualisiert $(date -u +'%Y-%m-%d')"
          # Pull --rebase vor dem Push, um Konflikte mit parallelen Commits zu vermeiden
          git pull --rebase origin main
          git push origin main
