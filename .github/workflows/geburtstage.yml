name: Geburtstage aktualisieren
 
on:
  # Jeden Tag um 00:05 Uhr UTC (= 02:05 Uhr Berlin-Zeit im Sommer)
  schedule:
    - cron: '5 0 * * *'
 
  # Manueller Start-Button im GitHub UI (zum Testen)
  workflow_dispatch:
 
jobs:
  fetch-geburtstage:
    runs-on: ubuntu-latest
 
    steps:
      # 1. Repo auschecken
      - name: Repository auschecken
        uses: actions/checkout@v4
 
      # 2. Python einrichten
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
 
      # 3. Script ausführen
      - name: Geburtstage fetchen
        run: python scripts/fetch_geburtstage.py
 
      # 4. Geänderte JSON zurück ins Repo pushen
      - name: JSON committen und pushen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/geburtstage.json
          git diff --cached --quiet || git commit -m "chore: geburtstage aktualisiert $(date -u +'%Y-%m-%d')"
          git push
 
