name: Geburtstage aktualisieren

on:
  schedule:
    - cron: '5 0 * * *'
  workflow_dispatch:

jobs:
  fetch-geburtstage:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Geburtstage fetchen
        run: python scripts/fetch_geburtstage.py

      - name: JSON committen und pushen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/geburtstage.json
          git diff --cached --quiet || git commit -m "chore: geburtstage aktualisiert $(date -u +'%Y-%m-%d')"
          git push
