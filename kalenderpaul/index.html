<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Kalender – Paul 2026</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f5f5f7;
  --surface: #ffffff;
  --surface2: #f5f5f7;
  --border: rgba(0,0,0,.08);
  --text: #1d1d1f;
  --text2: #6e6e73;
  --text3: #aeaeb2;
  --blue: #0071e3;
  --blue-l: #e8f1fb;
  --red: #ff3b30;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1c1c1e;
    --surface: #2c2c2e;
    --surface2: #3a3a3c;
    --border: rgba(255,255,255,.12);
    --text: #f5f5f7;
    --text2: #98989d;
    --text3: #636366;
    --blue: #0a84ff;
    --blue-l: #0a2a4a;
    --red: #ff453a;
  }

  body { background: #1c1c1e; }

  /* Event colors dark */
  .e-kids     { background: #0a3d8f; color: #a8c8ff; font-weight: 700; }
  .e-dani     { background: #3a3a3c; color: #98989d; }
  .e-schwerin { background: #6b3a00; color: #ffd580; font-weight: 700; }
  .e-maja     { background: #7b1050; color: #ffb0d0; font-weight: 700; }
  .e-trip     { background: #0a4a30; color: #80e8c0; font-weight: 700; }
  .e-work     { background: #0a2a6b; color: #80b0ff; font-weight: 600; }
  .e-kidev    { background: #7b0a0a; color: #ffa0a0; font-weight: 600; }
  .e-feier    { background: #4a3800; color: #ffd580; font-weight: 600; }
  .e-union    { background: #7b0a0a; color: #ffa0a0; font-weight: 700; }
  .e-konzert  { background: #0a4a20; color: #80e0a0; font-weight: 700; }
  .e-haus     { background: #004a6b; color: #80d0f0; font-weight: 600; }
  .e-bday     { background: #3a3a3c; color: #636366; font-style: italic; }

  /* Header */
  .header { background: rgba(28,28,30,0.95); }
  .header-text h1 { color: #f5f5f7; }
  .header-text p  { color: #98989d; }

  /* Sticky bar + weekdays */
  .sticky-bar { background: rgba(44,44,46,0.97); border-bottom-color: rgba(255,255,255,.08); }

  /* Month card */
  .mc { background: #2c2c2e; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
  .mt { color: #f5f5f7; }

  /* Day cells */
  .day { background: #3a3a3c; }
  .day.today { background: #0a2a4a; box-shadow: inset 0 0 0 1.5px #0a84ff; }
  .day.empty { background: transparent; }
  .day.past  { opacity: .25; }
  .dn { color: #f5f5f7; }
  .day.weekend .dn { color: #ff453a; }
  .day.today .dn { background: #0a84ff; color: #fff; }

  /* Detail panel */
  .dp { background: #2c2c2e; }
  .dp h3 { color: #f5f5f7; }
  .eli { background: #3a3a3c; }
  .eli .en { color: #f5f5f7; }

  /* Filter sheet */
  .filter-panel { background: #2c2c2e; }
  .filter-panel-handle { background: #636366; }
  .fp-title { color: #f5f5f7; }
  .fp-close { background: #3a3a3c; color: #98989d; border-color: rgba(255,255,255,.1); }
  .fp-item { background: #3a3a3c; border-color: rgba(255,255,255,.08); color: #f5f5f7; }
  .fp-item:hover { background: #48484a; border-color: #0a84ff; }
  .fp-date { color: #98989d; }
  .filter-backdrop { background: rgba(0,0,0,0.65); }

  /* Legend chips */
  .li { background: #3a3a3c; border-color: rgba(255,255,255,.1); color: #98989d; }
  .li:hover { background: #48484a; color: #0a84ff; border-color: #0a84ff; }

  /* Today strip */
  .today-panel { border-top-color: rgba(255,255,255,.1); }
  .tp-title { color: #0a84ff; }
  .tp-date { color: #636366; }
  .tp-item { background: #3a3a3c; border-color: rgba(255,255,255,.08); color: #f5f5f7; }

  /* Buttons */
  .today-btn { background: #3a3a3c; border-color: #0a84ff; color: #0a84ff; }

  /* Day overlay */
  .day-overlay { background: rgba(0,0,0,0.55); }
  .day.expanded { background: #2c2c2e !important; }

  /* Weekday labels */
  .wh span { color: #636366; }
  .wh span.we { color: #ff453a; opacity: .8; }
  .sticky-bar-days span { color: #636366; }
  .sticky-bar-days span.we { color: #ff453a; }
  .sticky-bar-month { color: #f5f5f7; }
  .kw { color: #636366; }
}
body {
  font-family: -apple-system, 'Helvetica Neue', sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

/* HEADER */
.header {
  background: var(--surface);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 10;
  padding: 10px 0 0;
}
.header-inner {
  max-width: 1100px;
  margin: 0 auto;
  padding: 0 28px;
}
.header-top {
  display: flex;
  align-items: center;
  justify-content: flex-start;
  gap: 16px;
  margin-bottom: 8px;
}
.header-title {
  display: flex;
  align-items: center;
  gap: 8px;
}
.header-icon { font-size: 22px; line-height: 1; }
.header-text h1 {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -.3px;
  color: var(--text);
}
.header-text p {
  font-size: 10.5px;
  color: var(--text2);
  margin-top: 1px;
}
/* Legend inside header */
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  padding: 0 0 8px;
  justify-content: flex-start;
  position: static;
  border: none;
  background: transparent;
}
@media (max-width: 600px) {
  .legend {
    flex-wrap: nowrap;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .legend::-webkit-scrollbar { display: none; }
}
/* Today strip inside header */
.today-panel {
  background: transparent;
  border-top: 1px solid var(--border);
  padding: 6px 0 8px;
  position: static;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  transition: opacity 0.3s ease, max-height 0.3s ease, padding 0.3s ease;
  overflow: hidden;
  max-height: 60px;
  opacity: 1;
}
.today-panel.hidden {
  max-height: 0;
  opacity: 0;
  padding: 0;
  border-top: none;
}

/* Legend */
/* legend in header */
.li {
  display: flex; align-items: center; gap: 4px;
  font-size: 10.5px; font-weight: 500; color: var(--text2);
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 20px; padding: 3px 8px;
  cursor: pointer; transition: .15s; user-select: none;
  white-space: nowrap; flex-shrink: 0;
}
.li:hover { border-color: var(--blue); color: var(--blue); transform: scale(1.04); }
.li.active { border-color: currentColor; box-shadow: 0 0 0 2px currentColor; }
.ld { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

/* today-panel moved into header */
.tp-header {
  display: flex; align-items: center; gap: 8px; flex-shrink: 0;
}
.tp-title {
  font-size: 11px; font-weight: 800; color: var(--blue);
  text-transform: uppercase; letter-spacing: .8px;
}
.tp-date {
  font-size: 11px; color: var(--text3); font-weight: 400;
}
.tp-list {
  display: flex; flex-wrap: wrap; gap: 6px; flex: 1;
}
.tp-item {
  display: flex; align-items: center; gap: 5px;
  font-size: 10.5px; font-weight: 500; color: var(--text);
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 7px; padding: 3px 9px;
  cursor: pointer; transition: .15s; white-space: nowrap;
}
.tp-item:hover { border-color: var(--blue); background: var(--blue-l); }
.tp-empty {
  font-size: 12px; color: var(--text3); padding: 4px 0; font-style: italic;
}

/* Filter Bottom Sheet */
.filter-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 200;
  -webkit-tap-highlight-color: transparent;
}
.filter-backdrop.on { display: block; }
.filter-panel {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 201;
  background: var(--surface);
  border-radius: 20px 20px 0 0;
  padding: 0;
  max-height: 60vh;
  display: none;
  flex-direction: column;
  box-shadow: 0 -4px 30px rgba(0,0,0,0.15);
  transform: translateY(100%);
  transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
}
.filter-panel.on {
  display: flex;
  transform: translateY(0);
}
.filter-panel-handle {
  width: 36px; height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin: 12px auto 0;
  flex-shrink: 0;
}
.filter-panel-inner {
  padding: 12px 20px 20px;
  display: flex;
  flex-direction: column;
  flex: 1;
  overflow: hidden;
  min-height: 0;
}
.fp-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 10px;
  flex-shrink: 0;
}
.fp-title { font-size: 15px; font-weight: 700; letter-spacing: -.3px; }
.fp-close {
  width: 28px; height: 28px; border-radius: 50%;
  border: 1px solid var(--border); background: var(--surface2);
  cursor: pointer; font-size: 13px; color: var(--text2);
  display: flex; align-items: center; justify-content: center;
  transition: .15s;
}
.fp-close:hover { background: var(--border); }
.fp-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 6px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  flex: 1;
  min-height: 0;
  padding-bottom: 8px;
}
@media (max-width: 600px) {
  .fp-list { grid-template-columns: 1fr; }
}
.fp-item {
  display: flex; align-items: center; gap: 7px;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 10px; padding: 7px 12px;
  font-size: 12.5px; font-weight: 500; color: var(--text);
  cursor: pointer; transition: .15s;
}
.fp-item:hover { border-color: var(--blue); background: var(--blue-l); }
.fp-date { font-size: 11px; color: var(--text2); margin-left: 2px; }

/* MAIN */
.main { padding: 24px 32px 60px; max-width: 1100px; margin: 0 auto; }

/* Month card */
.mc {
  background: var(--surface);
  border-radius: 16px;
  padding: 22px;
  margin-bottom: 20px;
  box-shadow: 0 1px 3px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.04);
  overflow: clip;
  color: var(--text);
}
.mt { font-size: 18px; font-weight: 700; letter-spacing: -.3px; margin-bottom: 14px; }

.wh {
  display: grid;
  grid-template-columns: 26px repeat(7, 1fr);
  gap: 2px; margin-bottom: 3px;
}
.wh span {
  text-align: center; font-size: 10px; font-weight: 600;
  color: var(--text3); text-transform: uppercase; letter-spacing: .3px; padding: 3px 0;
}
.wh .we { color: var(--red); opacity: .7; }

.cg { display: flex; flex-direction: column; gap: 2px; }
.wr { display: grid; grid-template-columns: 26px repeat(7, 1fr); gap: 2px; }

.kw {
  font-size: 8.5px; font-weight: 600; color: var(--text3);
  display: flex; align-items: flex-start; justify-content: center; padding-top: 7px;
}

.day {
  background: var(--surface2);
  border-radius: 9px;
  height: 90px;
  padding: 5px 6px;
  cursor: pointer;
  transition: transform .12s, box-shadow .12s;
  position: relative;
  overflow: hidden;
  color: var(--text);
}
.day:not(.empty):not(.expanded):hover { transform: scale(1.025); box-shadow: 0 4px 12px rgba(0,0,0,.1); z-index: 2; }
.day.expanded:hover { transform: none; }
.day.empty { background: transparent; pointer-events: none; }
.day.past { opacity: .32; }
.day.today {
  background: var(--blue-l);
  box-shadow: inset 0 0 0 2px var(--blue);
  outline: 2px solid var(--blue);
  outline-offset: -1px;
  z-index: 1;
  position: relative;
}

.dn {
  font-size: 12px; font-weight: 600; color: var(--text);
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; border-radius: 50%; margin-bottom: 3px;
}
.day.today .dn  { background: var(--blue); color: #fff; font-size: 11px; }
.day.weekend .dn { color: var(--red); }
.day.today.weekend .dn { color: #fff; }

.evt {
  font-size: 9px; font-weight: 500;
  padding: 1.5px 5px; border-radius: 5px;
  margin-bottom: 1.5px; display: block;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  line-height: 1.5;
}

/* ── FARBEN – MAXIMALER KONTRAST ── */
/* Kids bei Paul – leuchtendes Royal-Blau */
.e-kids     { background: #1a56db; color: #ffffff; font-weight: 700; }
/* Kids bei Dani – Mittelgrau */
.e-dani     { background: #d1d5db; color: #374151; }
/* Schwerin – sattes Orange */
.e-schwerin { background: #f97316; color: #fff7ed; font-weight: 700; }
/* Mit Maja – kräftiges Magenta */
.e-maja     { background: #db2777; color: #fff0f6; font-weight: 700; }
/* Ausflug/Urlaub – saftiges Grün */
.e-trip     { background: #059669; color: #ecfdf5; font-weight: 700; }
/* Events/Veranstaltungen – tiefes Violett */
.e-event    { background: #7c3aed; color: #f5f3ff; font-weight: 600; }
/* Arbeit/Kongress – Dunkelblau */
.e-work     { background: #1e40af; color: #dbeafe; font-weight: 600; }
/* Kids-Events (Schule etc) – kräftiges Rot */
.e-kidev    { background: #dc2626; color: #fff5f5; font-weight: 600; }
/* Geburtstage – helles Grau kursiv */
.e-bday     { background: #f3f4f6; color: #9ca3af; font-style: italic; }
/* Wohnungsbesichtigung – Smaragd */
.e-haus     { background: #00a0e3; color: #ffffff; font-weight: 600; }
/* Union Berlin */
.e-union    { background: #b91c1c; color: #fee2e2; font-weight: 700; }
/* Geburtstage */
.e-bday-filter { display: none; }
/* Konzerte & Events */
.e-konzert  { background: #16a34a; color: #f0fdf4; font-weight: 700; }
/* Invisible duplicate tag - only for filter, hidden in calendar */
.e-konzert-hidden { display: none; }
/* Feiertage & Schulferien Berlin */
.e-feier    { background: #fef9c3; color: #713f12; font-weight: 600; }

/* Detail panel */
.dp {
  display: none; background: var(--surface); border-radius: 14px;
  padding: 16px 20px; margin-bottom: 18px;
  box-shadow: 0 1px 3px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.04);
  animation: fu .2s ease;
}
.dp.on { display: block; }
@keyframes fu { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:none} }
.dp h3 { font-size: 15px; font-weight: 700; margin-bottom: 2px; }
.dp .ds { font-size: 12px; color: var(--text2); margin-bottom: 10px; }
.eli { display: flex; align-items: center; padding: 8px 10px; border-radius: 8px; background: var(--surface2); margin-bottom: 4px; }
.eli .en { font-size: 13px; font-weight: 500; }
.eli .et { font-size: 11px; color: var(--text2); margin-top: 1px; }
.eli-dot { width: 10px; height: 10px; border-radius: 50%; margin-right: 10px; flex-shrink: 0; }

.close-dp {
  float: right; font-size: 18px; color: var(--text3);
  cursor: pointer; margin-top: -2px; line-height: 1;
}
.close-dp:hover { color: var(--text); }

.toast {
  position: fixed; bottom: 22px; left: 50%;
  transform: translateX(-50%) translateY(16px);
  background: #1d1d1f; color: #fff; font-size: 12.5px; font-weight: 500;
  padding: 9px 18px; border-radius: 20px; opacity: 0; transition: .28s;
  z-index: 200; pointer-events: none;
}
.toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

/* Scroll to today btn */
.today-btn {
  font-family: inherit; font-size: 11px; font-weight: 600;
  padding: 5px 12px; border-radius: 7px;
  border: 1px solid var(--border); background: var(--surface2);
  color: var(--text2); cursor: pointer; transition: .15s;
}
.today-btn:hover { border-color: var(--blue); color: var(--blue); background: var(--blue-l); }
/* Expanded day cell */
.day.expanded {
  position: fixed !important;
  z-index: 50;
  border-radius: 16px !important;
  background: var(--surface) !important;
  box-shadow: 0 8px 40px rgba(0,0,0,0.22) !important;
  padding: 14px !important;
  min-height: unset !important;
  height: auto !important;
  overflow: visible !important;
  cursor: pointer;
  animation: expandIn 0.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}
.day.expanded .dn { font-size: 16px !important; width: 30px !important; height: 30px !important; margin-bottom: 8px !important; }
.day.expanded .evt { font-size: 12px !important; padding: 4px 8px !important; border-radius: 7px !important; margin-bottom: 4px !important; white-space: normal !important; overflow: visible !important; text-overflow: unset !important; line-height: 1.5 !important; }
.day-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.25);
  z-index: 49;
  backdrop-filter: blur(2px);
}
.day-overlay.on { display: block; }
@keyframes expandIn {
  from { opacity: 0.7; transform: scale(0.9); }
  to   { opacity: 1;   transform: scale(1); }
}

/* Sticky month + weekday bar */
.sticky-bar {
  position: sticky;
  top: var(--header-h, 0px);
  z-index: 5;
  background: var(--surface);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  padding: 6px 22px 4px;
  margin: -22px -22px 8px -22px;
  border-radius: 14px 14px 0 0;
}
.sticky-bar-month {
  font-size: 13px; font-weight: 700; color: var(--text);
  letter-spacing: -.2px; margin-bottom: 4px;
}
.sticky-bar-days {
  display: grid;
  grid-template-columns: 26px repeat(7, 1fr);
  gap: 2px;
}
.sticky-bar-days span {
  text-align: center; font-size: 10px; font-weight: 600;
  color: var(--text3); text-transform: uppercase; letter-spacing: .3px;
  padding: 2px 0;
}
.sticky-bar-days span.we { color: var(--red); opacity: .7; }

@media (max-width: 600px) {
  .sticky-bar { padding: 6px 8px 3px; margin: -12px -8px 8px -8px; }
  .sticky-bar-month { font-size: 12px; }
  .sticky-bar-days { grid-template-columns: 18px repeat(7, 1fr); gap: 1px; }
  .sticky-bar-days span { font-size: 9px; }
}

.header-search {
  margin-bottom: 7px;
}
.header-search {
  display: flex;
  align-items: center;
  gap: 8px;
}
.header-search input {
  width: 100%;
  max-width: 280px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  font-family: inherit;
  font-size: 12px;
  color: var(--text);
  padding: 6px 12px;
  outline: none;
  transition: border-color .15s;
}
.header-search input:focus { border-color: var(--blue); }
.header-search input::placeholder { color: var(--text3); }
.search-count {
  font-size: 11px;
  color: var(--text3);
  white-space: nowrap;
}
.search-clear {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--text3);
  font-size: 14px;
  padding: 2px 4px;
  border-radius: 4px;
  transition: .15s;
}
.search-clear:hover { color: var(--red); background: var(--surface2); }

.day.search-match {
  outline: 2px solid var(--blue) !important;
  outline-offset: -1px;
  z-index: 2;
  position: relative;
}

@media (max-width: 600px) {
  .header-search input { max-width: 100%; font-size: 11px; }
}

@keyframes wobble {
  0%   { transform: scale(1); box-shadow: none; }
  25%  { transform: scale(1.1); box-shadow: 0 8px 24px rgba(0,113,227,0.25); }
  50%  { transform: scale(0.96); }
  70%  { transform: scale(1.05); }
  85%  { transform: scale(0.99); }
  100% { transform: scale(1); box-shadow: none; }
}
.wobble {
  animation: wobble 0.55s cubic-bezier(.36,.07,.19,.97) forwards !important;
  z-index: 10;
  position: relative;
}

/* ═══════════════════════════════════════════
   RESPONSIVE MOBILE (iPhone 16 Pro ~393px)
   ═══════════════════════════════════════════ */
@media (max-width: 600px) {
  body { font-size: 13px; }

  /* Header */
  .header { padding: 10px 16px 0; }
  .header-top { gap: 10px; margin-bottom: 6px; }
  .header-icon { font-size: 18px; }
  .header-text h1 { font-size: 14px; }
  .header-text p { font-size: 10px; }
  .today-btn { font-size: 10px; padding: 4px 10px; }

  /* Legend - scrollable horizontal strip */
  .legend {
    flex-wrap: nowrap;
    overflow-x: auto;

// ── HELPERS ──────────────────────────────────────────────────────────
function pad(n) { return String(n).padStart(2,'0'); }
function dk(y,m,d) { return `${y}-${pad(m+1)}-${pad(d)}`; }
function kw(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const day = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - day);
  const ys = new Date(Date.UTC(d.getUTCFullYear(),0,1));
  return Math.ceil((((d-ys)/86400000)+1)/7);
}
function fmtDate(s) {
  const [y,m,d] = s.split('-').map(Number);
  const dow = new Date(y,m-1,d).getDay();
  const di = dow===0?6:dow-1;
  return `${DN[di]}, ${d}. ${MN[m-1]} ${y}`;
}

// ── RENDER ───────────────────────────────────────────────────────────
function buildMonth(year, month) {
  const fl = new Date(year,month,1), ll = new Date(year,month+1,0);
  let dow = fl.getDay(); if(dow===0) dow=7; dow--;

  const card = document.createElement('div');
  card.className = 'mc';
  card.id = `m-${year}-${month}`;

  // Sticky bar with month name + weekdays
  const stickyBar = document.createElement('div');
  stickyBar.className = 'sticky-bar';
  const stickyMonth = document.createElement('div');
  stickyMonth.className = 'sticky-bar-month';
  stickyMonth.textContent = `${MN[month]} ${year}`;
  const stickyDays = document.createElement('div');
  stickyDays.className = 'sticky-bar-days';
  stickyDays.innerHTML = '<span></span>' + WD.map((d,i)=>`<span class="${i>=5?'we':''}">${d}</span>`).join('');
  stickyBar.appendChild(stickyMonth);
  stickyBar.appendChild(stickyDays);
  card.appendChild(stickyBar);

  const grid = document.createElement('div');
  grid.className = 'cg';
  // Only show days from start of current week onwards
  const now2 = new Date();
  const nowDow = now2.getDay() === 0 ? 6 : now2.getDay() - 1;
  const weekMon = new Date(now2);
  weekMon.setDate(now2.getDate() - nowDow);
  weekMon.setHours(0,0,0,0);

  let day=1, wk=0;

  while(day <= ll.getDate()) {
    // Calculate the last day of this grid row
    let lastDayInRow;
    if(wk === 0) {
      // First row: starts at day 1, ends at day (7 - dow)
      lastDayInRow = 7 - dow;
    } else {
      lastDayInRow = day + 6;
    }
    const rowEndDate = new Date(year, month, Math.min(lastDayInRow, ll.getDate()));
    
    if(rowEndDate < weekMon) {
      // Entire row is in the past — skip
      if(wk === 0) {
        day = 7 - dow + 1;
      } else {
        day += 7;
      }
      wk++;
      continue;
    }

    const row = document.createElement('div');
    row.className = 'wr';
    const cur = new Date(year, month, day);
    const kwDiv = document.createElement('div');
    kwDiv.className = 'kw';
    kwDiv.textContent = kw(cur);
    row.appendChild(kwDiv);

    for(let col=0; col<7; col++) {
      const cell = document.createElement('div');
      if((wk===0 && col<dow) || day>ll.getDate()) {
        cell.className = 'day empty';
        row.appendChild(cell);
        continue;
      }
      const key = dk(year, month, day);
      const cd = new Date(year, month, day);
      const isPast = cd < weekMon;
      const isToday = year===today.getFullYear() && month===today.getMonth() && day===today.getDate();
      const isWE = col >= 5;

      cell.className = 'day' + (isToday?' today':'') + (isWE?' weekend':'') + (isPast?' past':'');
      cell.dataset.key = key;

      const num = document.createElement('span');
      num.className = 'dn';
      num.textContent = day;
      cell.appendChild(num);

      const evs = SE[key] || [];
      evs.slice(0,3).forEach(ev => {
        const e = document.createElement('span');
        e.className = `evt ${ev.c}`;
        e.textContent = ev.t;
        cell.appendChild(e);
      });
      if(evs.length > 3) {
        const m = document.createElement('span');
        m.className = 'evt e-bday';
        m.textContent = `+${evs.length-3} mehr`;
        cell.appendChild(m);
      }

      cell.onclick = (e) => {
        if(expandedDay === cell) { collapseDay(); return; }
        if(expandedDay) { collapseDay(); }
        expandDay(cell, e);
        openDp(key);
      };
      row.appendChild(cell);
      day++;
    }
    grid.appendChild(row);
    wk++;
  }
  card.appendChild(grid);
  return card;
}

let selectedCell = null;

function openDp(key) {
  // Remove highlight from previous selected cell
  if(selectedCell) {
    selectedCell.style.outline = '';
    selectedCell.style.outlineOffset = '';
  }
  // Briefly highlight clicked cell, then remove
  const clickedCell = document.querySelector(`.day[data-key="${key}"]`);
  if(clickedCell) {
    // Clear previous
    document.querySelectorAll('.day').forEach(d => { d.style.outline = ''; d.style.outlineOffset = ''; });
    clickedCell.style.outline = '2.5px solid var(--blue)';
    clickedCell.style.outlineOffset = '2px';
    selectedCell = clickedCell;
    // Auto-remove after 1.5s
    setTimeout(() => {
      clickedCell.style.outline = '';
      clickedCell.style.outlineOffset = '';
      selectedCell = null;
    }, 1500);
  }

  const panel = document.getElementById('dp');
  panel.classList.add('on');
  document.getElementById('dp-title').textContent = fmtDate(key);
  const ec = document.getElementById('dp-evts');
  ec.innerHTML = '';
  const evs = SE[key] || [];
  if(!evs.length) {
    ec.innerHTML = '<p style="font-size:12.5px;color:var(--text3);padding:6px 0">Keine Termine.</p>';
  }

  const colorMap = {
    'e-kids':'#1a56db','e-dani':'#6b7280','e-schwerin':'#f97316',
    'e-maja':'#db2777','e-trip':'#059669',
    'e-work':'#1e40af','e-kidev':'#dc2626','e-bday':'#9ca3af',
    'e-feier':'#713f12','e-union':'#b91c1c','e-konzert':'#16a34a','e-haus':'#00a0e3'
  };

  evs.filter(ev => !ev.c.includes('hidden')).forEach(ev => {
    const el = document.createElement('div');
    el.className = 'eli';
    const color = colorMap[ev.c] || '#aeaeb2';
    el.innerHTML = `<div class="eli-dot" style="background:${color}"></div><div><div class="en">${ev.t}</div></div>`;
    ec.appendChild(el);
  });

  // Detail panel is at top of main - no extra scroll needed
}

function closeDp() {
  document.getElementById('dp').classList.remove('on');
  if(selectedCell) {
    selectedCell.style.outline = '';
    selectedCell.style.outlineOffset = '';
    selectedCell = null;
  }
}

function scrollToToday() {
  // Clear any previously selected/highlighted cell
  if(selectedCell) {
    selectedCell.style.outline = '';
    selectedCell.style.outlineOffset = '';
    selectedCell = null;
  }
  // Also clear any leftover outlines from filter clicks
  document.querySelectorAll('.day').forEach(d => {
    d.style.outline = '';
    d.style.outlineOffset = '';
  });

  const cell = document.querySelector('.day.today');
  if(!cell) return;

  const header = document.querySelector('.header');
  const headerH = header ? header.offsetHeight : 160;
  const cellAbsTop = cell.getBoundingClientRect().top + window.pageYOffset;
  // Account for sticky-bar (month+weekdays) height
  const stickyBar = cell.closest('.mc')?.querySelector('.sticky-bar');
  const stickyBarH = stickyBar ? stickyBar.offsetHeight : 0;
  const isMobile = window.innerWidth <= 600;
  const extraPad = isMobile ? 16 : 16;
  window.scrollTo({ top: cellAbsTop - headerH - stickyBarH - extraPad, behavior: 'smooth' });

  setTimeout(() => {
    cell.classList.add('wobble');
    setTimeout(() => cell.classList.remove('wobble'), 600);
  }, 350);
}

// Render months from current week onwards
function renderAll() {
  const cal = document.getElementById('cal');
  cal.innerHTML = '';
  // Find Monday of current week
  const now = new Date();
  const dow = now.getDay() === 0 ? 6 : now.getDay() - 1;
  const weekStart = new Date(now);
  weekStart.setDate(now.getDate() - dow);
  weekStart.setHours(0,0,0,0);

  // Start from the month that contains the first VISIBLE week
  // If weekStart is in a previous month but all rows of that month are past, skip it
  let startMonth = weekStart.getMonth();
  const startYear = weekStart.getFullYear();

  // Check: does the current month have any visible rows?
  // A month has visible rows if its last day >= weekStart
  const lastDayOfStartMonth = new Date(startYear, startMonth + 1, 0);
  if(lastDayOfStartMonth < weekStart) {
    startMonth++; // skip to next month
  }

  for(let m=startMonth; m<=11; m++) {
    cal.appendChild(buildMonth(startYear, m));
  }
  // Scroll so current week is at top
  setTimeout(() => {
    const cell = document.querySelector('.day.today') ||
                 document.querySelector(`[data-key="${dk(weekStart.getFullYear(), weekStart.getMonth(), weekStart.getDate())}"]`);
    if(cell) {
      const offset = 220;
      const top = cell.getBoundingClientRect().top + window.scrollY - offset;
      window.scrollTo({top, behavior:'instant'});
    }
  }, 50);
}

// ── EXPAND/COLLAPSE DAY ─────────────────────────────────────────────
let expandedDay = null;
let expandedRect = null;

function expandDay(cell, e) {
  e.stopPropagation();
  if(cell.classList.contains('expanded')) {
    collapseDay();
    return;
  }
  if(expandedDay) collapseDay();

  // Save original rect for collapse animation
  expandedRect = cell.getBoundingClientRect();
  expandedDay = cell;

  // Position expanded cell centered on screen
  const w = Math.min(280, window.innerWidth - 32);
  const h = 'auto';
  const left = Math.max(16, (window.innerWidth - w) / 2);
  const top = Math.max(80, (window.innerHeight - 300) / 2);

  cell.style.width = w + 'px';
  cell.style.left = left + 'px';
  cell.style.top = top + 'px';
  cell.classList.add('expanded');
  document.getElementById('dayOverlay').classList.add('on');
}

function collapseDay() {
  if(!expandedDay) return;
  expandedDay.classList.remove('expanded');
  expandedDay.style.width = '';
  expandedDay.style.left = '';
  expandedDay.style.top = '';
  expandedDay = null;
  document.getElementById('dayOverlay').classList.remove('on');
}

let activeFilter = null;

function filterBy(cat) {
  const panel = document.getElementById('filterPanel');
  const list  = document.getElementById('fpList');
  const title = document.getElementById('fpTitle');

  // Toggle off
  if(activeFilter === cat) {
    closeFilter(); return;
  }
  activeFilter = cat;

  // Update legend active state
  document.querySelectorAll('.li').forEach(el => {
    el.classList.toggle('active', el.dataset.cat === cat);
    if(el.dataset.cat === cat) el.style.color = catColors[cat];
    else el.style.color = '';
  });

  // Collect matching dates
  const matches = [];
  const todayKey = dk(today.getFullYear(), today.getMonth(), today.getDate());
  const allDates = Object.keys(SE).sort().filter(d => d >= todayKey);
  allDates.forEach(d => {
    const evs = SE[d] || [];
    const matched = evs.filter(ev => ev.c === cat || ev.c === cat+'-hidden');
    if(matched.length) matches.push({dk: d, evs: matched});
  });

  title.textContent = `${catLabels[cat]} (${matches.length} Einträge)`;
  list.innerHTML = '';

  if(!matches.length) {
    list.innerHTML = '<span style="font-size:12.5px;color:var(--text3)">Keine Einträge gefunden.</span>';
  } else {
    matches.forEach(({dk, evs}) => {
      evs.forEach(ev => {
        const item = document.createElement('div');
        item.className = 'fp-item';
        item.onclick = () => {
          const cell = document.querySelector(`.day[data-key="${dk}"]`);
          const header = document.querySelector('.header');
          const headerH = header ? header.offsetHeight : 160;
          if(cell) {
            // Get absolute position relative to page
            const cellTop = cell.getBoundingClientRect().top + window.pageYOffset;
            const filterPanel = document.getElementById('filterPanel');
            const filterH = filterPanel ? filterPanel.offsetHeight : 0;
            window.scrollTo({ top: cellTop - headerH - filterH - 16, behavior: 'smooth' });
            setTimeout(() => {
              closeFilter();
              openDp(dk);
            }, 500);
          } else {
            closeFilter();
            openDp(dk);
          }
        };
        item.innerHTML = `<span style="color:${catColors[cat]};font-size:13px">●</span> <div><div>${ev.t.replace(/^[^\w\s]*\s*/,'')}</div><div class="fp-date">${fmtDate(dk)}</div></div>`;
        list.appendChild(item);
      });
    });
  }

  panel.classList.add('on');
  document.getElementById('filterBackdrop').classList.add('on');
}

function closeFilter() {
  activeFilter = null;
  document.getElementById('filterPanel').classList.remove('on');
  document.getElementById('filterBackdrop').classList.remove('on');
  document.querySelectorAll('.li').forEach(el => {
    el.classList.remove('active');
    el.style.color = '';

function hideEmptyFilters() {
  const todayKey = dk(today.getFullYear(), today.getMonth(), today.getDate());
  const futureDates = Object.keys(SE).filter(d => d >= todayKey);
  
  document.querySelectorAll('.li[data-cat]').forEach(chip => {
    const cat = chip.dataset.cat;
    const hasEntries = futureDates.some(d => 
      (SE[d] || []).some(ev => ev.c === cat || ev.c === cat + '-hidden')
    );
    chip.style.display = hasEntries ? '' : 'none';
  });
}

function searchCalendar(query) {
  document.querySelectorAll('.day.search-match').forEach(d => d.classList.remove('search-match'));
  const clearBtn = document.getElementById('searchClear');
  const countEl = document.getElementById('searchCount');
  
  if(!query || query.trim().length < 2) {
    clearBtn.style.display = 'none';
    countEl.textContent = '';
    return;
  }
  
  clearBtn.style.display = 'block';
  
  // Support multi-word search (all words must match)
  const words = query.toLowerCase().trim().split(' ').filter(w => w.length > 0);
  const todayKey = dk(today.getFullYear(), today.getMonth(), today.getDate());
  let matches = 0;
  let firstMatch = null;
  
  Object.keys(SE).sort().forEach(key => {
    if(key < todayKey) return; // skip past
    const evs = SE[key] || [];
    const text = evs.map(ev => ev.t).join(' ').toLowerCase();
    const matched = words.every(w => text.includes(w));
    if(matched) {
      const cell = document.querySelector(`.day[data-key="${key}"]`);
      if(cell) {
        cell.classList.add('search-match');
        matches++;
        if(!firstMatch) firstMatch = cell;
      }
    }
  });
  
  countEl.textContent = matches > 0 ? `${matches} Treffer` : 'Kein Treffer';
  countEl.style.color = matches > 0 ? 'var(--blue)' : 'var(--red)';
  
  if(firstMatch) {
    const header = document.querySelector('.header');
    const headerH = header ? header.offsetHeight : 160;
    const cellTop = firstMatch.getBoundingClientRect().top + window.pageYOffset;
    window.scrollTo({ top: cellTop - headerH - 16, behavior: 'smooth' });
  }
}

function clearSearch() {
  document.getElementById('searchInput').value = '';
  document.getElementById('searchClear').style.display = 'none';
  document.getElementById('searchCount').textContent = '';
  document.querySelectorAll('.day.search-match').forEach(d => d.classList.remove('search-match'));
}

// ── iCAL PARSER ──────────────────────────────────────────────────────
function parseICS(text) {
  const events = [];
  const lines = text.replace(/\r\n /g, '').replace(/\r\n\t/g, '').split(/\r\n|\n/);
  let current = null;

  for(const line of lines) {
    if(line === 'BEGIN:VEVENT') {
      current = {};
    } else if(line === 'END:VEVENT' && current) {
      events.push(current);
      current = null;
    } else if(current) {
      const sep = line.indexOf(':');
      if(sep === -1) continue;
      const key = line.substring(0, sep).split(';')[0].toUpperCase();
      const val = line.substring(sep + 1);

      if(key === 'SUMMARY')      current.title = val;
      if(key === 'DESCRIPTION')  current.description = val;
      if(key === 'LOCATION')     current.location = val;
      if(key === 'UID')          current.uid = val;
      if(key === 'DTSTART') {
        current.startRaw = val;
        current.start = parseICSDate(val);
        current.allDay = !val.includes('T');
      }
      if(key === 'DTEND') {
        current.endRaw = val;
        current.end = parseICSDate(val);
      }
    }
  }
  return events;
}

function parseICSDate(val) {
  // Format: 20260515 or 20260515T180000Z or 20260515T180000
  const clean = val.replace('Z','').replace(/TZID=[^:]+:/,'');
  const y = clean.substring(0,4);
  const m = clean.substring(4,6);
  const d = clean.substring(6,8);
  return `${y}-${m}-${d}`;
}

function catFromTitle(title) {
  const t = (title||'').toLowerCase();
  if(t.includes('schwerin'))                          return 'e-schwerin';
  if(t.includes('maja') || t.includes('kawi') || t.includes('sing dela') || t.includes('finch') || t.includes('olivia') || t.includes('geburtstagsdrinks')) return 'e-maja';
  if(t.includes('konzert') || t.includes('bierwalker') || t.includes('markus krebs') || t.includes('6k united')) return 'e-konzert';
  if(t.includes('kids bei dani'))                     return 'e-dani';
  if(t.includes('kids'))                              return 'e-kids';
  if(t.includes('alma'))                              return 'e-kidev';
  if(t.includes('spendenlauf') || t.includes('schule') || t.includes('rosa') || t.includes('emil') || t.includes('kiefer') || t.includes('prophylaxe') || t.includes('eltern')) return 'e-kidev';
  if(t.includes('besichtigung') || t.includes('berlinovo')) return 'e-haus';
  if(t.includes('bodensee') || t.includes('łeba') || t.includes('leba') || t.includes('urlaub') || t.includes('parchim')) return 'e-trip';
  if(t.includes('firmenlauf') || t.includes('kongress')) return 'e-work';
  return 'e-event-ical';
}

// Inject iCal events into SE object
function injectICalEvents(events) {
  const todayKey = dk(today.getFullYear(), today.getMonth(), today.getDate());

  for(const ev of events) {
    if(!ev.start || !ev.title) continue;
    // Skip past events
    if(ev.start < todayKey) continue;
    // Skip events already covered by static data
    const title = ev.title.trim();

    const cat = catFromTitle(title);
    const display = title;

    // For multi-day events, add to each day
    if(ev.end && ev.end > ev.start) {
      let cur = new Date(ev.start + 'T00:00:00');
      const endD = new Date(ev.end + 'T00:00:00');
      while(cur < endD) {
        const key = cur.toISOString().substring(0,10);
        if(!SE[key]) SE[key] = [];
        // Don't duplicate
        if(!SE[key].some(e => e.t.includes(title.substring(0,15)))) {
          SE[key].push({t: display, c: cat, fromIcal: true});
        }
        cur.setDate(cur.getDate() + 1);
      }
    } else {
      if(!SE[ev.start]) SE[ev.start] = [];
      if(!SE[ev.start].some(e => e.t.includes(title.substring(0,15)))) {
        SE[ev.start].push({t: display, c: cat, fromIcal: true});
      }
    }
  }
}

async function loadICalEvents() {
  if(!ICAL_URL) return; // No URL configured

  const statusEl = document.getElementById('ical-status');
  if(statusEl) statusEl.textContent = '🔄 Kalender wird geladen…';

  try {
    const proxyUrl = 'https://kalender-proxy.paul-bendzko.workers.dev/ical?url=' + encodeURIComponent(ICAL_URL);
    const res = await fetch(proxyUrl);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    const events = parseICS(text);
    injectICalEvents(events);
    if(statusEl) statusEl.textContent = `✅ ${events.length} Termine geladen`;
    setTimeout(() => { if(statusEl) statusEl.textContent = ''; }, 3000);
  } catch(err) {
    if(statusEl) statusEl.textContent = '⚠️ iCal nicht verfügbar (Server läuft?)';
    console.warn('iCal load error:', err.message);
  }

  // Re-render with fresh data
  renderAll();
  renderToday();
  hideEmptyFilters();
}
