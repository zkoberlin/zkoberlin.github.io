<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #f2f2f7; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 20px; font-family: -apple-system, sans-serif; padding: 40px; }
h2 { font-size: 15px; font-weight: 600; color: #1c1c1e; }
.preview { display: flex; gap: 20px; align-items: flex-end; flex-wrap: wrap; justify-content: center; }
.icon-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.size-label { font-size: 11px; color: #6e6e73; }
.btn { background: #0071e3; color: white; border: none; padding: 12px 28px; border-radius: 22px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 8px; }
.btn:hover { opacity: 0.85; }
</style>
</head>
<body>

<h2>Hub Icon – Variante 2</h2>
<div class="preview" id="preview"></div>
<button class="btn" onclick="downloadAll()">Als PNG herunterladen</button>

<script>
function drawIcon(size) {
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');
  const s = size;
  const cx = s / 2, cy = s / 2;

  // Rounded rect clip
  const r = s * 0.22;
  ctx.beginPath();
  ctx.moveTo(r, 0); ctx.lineTo(s-r, 0);
  ctx.quadraticCurveTo(s, 0, s, r);
  ctx.lineTo(s, s-r);
  ctx.quadraticCurveTo(s, s, s-r, s);
  ctx.lineTo(r, s);
  ctx.quadraticCurveTo(0, s, 0, s-r);
  ctx.lineTo(0, r);
  ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.closePath();
  ctx.clip();

  // Background
  ctx.fillStyle = '#1a1008';
  ctx.fillRect(0, 0, s, s);

  const sc = s / 180;
  const gold = 'rgba(255,200,60,';

  // Äußerer Kreis
  ctx.strokeStyle = gold + '0.55)';
  ctx.lineWidth = 1.5 * sc;
  ctx.beginPath(); ctx.arc(cx, cy, s * 0.40, 0, Math.PI * 2); ctx.stroke();

  // Innerer Kreis
  ctx.strokeStyle = gold + '0.2)';
  ctx.lineWidth = 1 * sc;
  ctx.beginPath(); ctx.arc(cx, cy, s * 0.27, 0, Math.PI * 2); ctx.stroke();

  // PB Monogramm
  ctx.fillStyle = gold + '0.95)';
  ctx.font = `700 ${s * 0.22}px -apple-system, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('PB', cx, cy);

  // Symbole an den 4 Positionen um den Kreis
  const outerR = s * 0.40;
  ctx.font = `${s * 0.13}px -apple-system, sans-serif`;
  ctx.textBaseline = 'middle';

  // Oben – Kalender
  ctx.fillText('📅', cx, cy - outerR);

  // Rechts – Euro
  ctx.font = `300 ${s * 0.16}px -apple-system, sans-serif`;
  ctx.fillStyle = gold + '0.75)';
  ctx.fillText('€', cx + outerR, cy);

  // Unten – Globus
  ctx.font = `${s * 0.13}px -apple-system, sans-serif`;
  ctx.fillText('🌐', cx, cy + outerR);

  // Links – Zahnrad
  ctx.fillText('⚙', cx - outerR, cy);

  return canvas;
}

const sizes = [180, 120, 87];
const preview = document.getElementById('preview');

sizes.forEach(size => {
  const canvas = drawIcon(size);
  const wrap = document.createElement('div');
  wrap.className = 'icon-wrap';
  wrap.appendChild(canvas);
  const lbl = document.createElement('div');
  lbl.className = 'size-label';
  lbl.textContent = size + 'px';
  wrap.appendChild(lbl);
  preview.appendChild(wrap);
});

function downloadAll() {
  sizes.forEach(size => {
    const canvas = drawIcon(size);
    const a = document.createElement('a');
    a.download = `zkoberlin-hub-icon-v2-${size}.png`;
    a.href = canvas.toDataURL('image/png');
    a.click();
  });
}
</script>
</body>
</html>
